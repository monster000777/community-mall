server:
  port: 8080
  servlet:
    context-path: /api

spring:
  application:
    name: community-mall-backend
  profiles:
    include: local   # 自动加载 application-local.yml（含敏感配置，已加入 .gitignore）
  
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${MYSQL_HOST:localhost}:3306/community_mall?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: root
    password: root
  
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: GMT+8
  
  # Redis 配置
  redis:
    host: ${REDIS_HOST:localhost}
    port: 6379
    password:  # 如果有密码请填写
    database: 1
    timeout: 10s
    lettuce:
      pool:
        max-active: 8
        max-wait: -1ms
        max-idle: 8
        min-idle: 0

# 上传文件路径配置
upload:
  path: ${UPLOAD_PATH:./uploads}

# MyBatis-Plus 配置
mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: deletedFlag
      logic-delete-value: 1
      logic-not-delete-value: 0
  mapper-locations: classpath*:/mapper/**/*.xml

# Sa-Token 配置
sa-token:
  # token 名称（同时也是 cookie 名称）
  token-name: satoken
  # token 有效期（单位：秒） 默认30天，-1 代表永久有效
  timeout: 86400
  # token 最低活跃频率（单位：秒），如果 token 超过此时间没有访问系统就会被冻结，默认-1 代表不限制，永不冻结
  active-timeout: -1
  # 是否允许同一账号多地同时登录（为 true 时允许一起登录, 为 false 时新登录挤掉旧登录）
  is-concurrent: true
  # 在多人登录同一账号时，是否共用一个 token（为 true 时所有登录共用一个 token, 为 false 时每次登录新建一个 token）
  is-share: false
  # token 风格（默认可取值：uuid、simple-uuid、random-32、random-64、random-128、tik）
  token-style: uuid
  # 是否输出操作日志
  is-log: true

# 日志配置
logging:
  level:
    com.community.mall: debug
    com.baomidou.mybatisplus: debug

# API Key 通过环境变量或者 local 配置文件注入
# 本地开发：在 application-local.yml 中配置真实 Key（已加入 .gitignore）
# 生产环境：设置服务器环境变量 OPENAI_API_KEY
openai:
  api-key: ${OPENAI_API_KEY:}
  base-url: ${OPENAI_BASE_URL:}
  model-name: ${OPENAI_MODEL_NAME:}

mimo:
  # MiMo 开放平台 API Key（可在官方平台 https://platform.xiaomimimo.com 申请）
  # 若未配置或无效，前端会自动降级回浏览器原生 SpeechSynthesis 播报
  api-key: ${MIMO_API_KEY:}
  # MiMo API 基地址。支持国内云端集群基地址 https://token-plan-cn.xiaomimimo.com/v1
  base-url: ${MIMO_BASE_URL:}
  # 语音合成模型。指定为官方最新旗舰级 Agent 语音合成大模型 mimo-v2.5-tts
  model: ${MIMO_MODEL:mimo-v2.5-tts}
  # 合成声音音色。官方内置中文精品音色包括：
  # - 冰糖 (默认)：活泼可爱、充满年轻活力的中文女声
  # - 茉莉：甜美温婉的中文女声
  # - 苏打：阳光朝气的中文男声
  # - 白桦：温暖儒雅的中文男声
  voice: ${MIMO_VOICE:冰糖}
