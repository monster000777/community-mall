server {
    listen 80;
    server_name localhost;

    # 开启 Gzip 压缩以加快静态资源传输速度
    # 注：application/json 用于压缩 API 响应；jpeg/png/gif 本身已压缩，不再列入避免浪费 CPU
    gzip on;
    gzip_min_length 1k;
    gzip_comp_level 6;
    gzip_types text/plain application/javascript application/x-javascript text/css application/xml text/javascript application/json;
    gzip_vary on;
    gzip_disable "MSIE [1-6]\.";

    # 上传头像/商品图的大小上限（nginx 默认仅 1m，会直接 413）
    client_max_body_size 20m;

    # 托管前端 Vue 构建生成的静态资源
    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html; # 兼容 Vue Router 的 History 模式
    }

    # 反向代理后端接口服务到 backend 容器
    # 使用变量 + resolver 动态解析：backend 容器重启换 IP 后无需重启 nginx 即可自动恢复。
    # 注意：proxy_pass 使用变量时，变量中的 URI 会整体替换原始请求 URI，
    # 因此变量里不能带 /api 路径（否则 /api/products/list 会被吞成 /api），
    # 不带 URI 时 nginx 将原始请求 URI 原样透传，与后端 context-path=/api 正好匹配。
    resolver 127.0.0.11 valid=10s ipv6=off;
    location /api {
        set $backend_upstream http://backend:8080;
        proxy_pass $backend_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 对大模型 SSE 流式输出（打字机效果）提供支持
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_read_timeout 3600s;
    }

    # 避免无 favicon.ico 时的 Nginx 报错日志干扰
    location = /favicon.ico {
        log_not_found off;
        access_log off;
    }
}
