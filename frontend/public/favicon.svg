  <!-- door -->
  <rect x="28" y="34" width="8" height="12" fill="none" stroke="url(#g)" stroke-width="3.5" stroke-linejoin="round"/>
  <!-- windows -->
  <rect x="21" y="34" width="5" height="6" fill="none" stroke="url(#g)" stroke-width="3" stroke-linejoin="round"/>
  <rect x="38" y="34" width="5" height="6" fill="none" stroke="url(#g)" stroke-width="3" stroke-linejoin="round"/>
</svg>
