services:
  # ==========================================
  # MySQL 数据库服务
  # ==========================================
  mysql:
    image: mysql:8.0
    container_name: community-mall-mysql
    restart: always
    environment:
      MYSQL_DATABASE: community_mall
      # 支持通过 .env 覆盖，未配置时默认 root（仅本地开发用途）
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
    ports:
      # 绑定 127.0.0.1：仅供本机开发调试连接，不对局域网/公网暴露
      - "127.0.0.1:3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      # 核心点：将初始化 SQL 文件挂载进初始化路径，容器首次启动时会自动导入
      - ./database/schema.sql:/docker-entrypoint-initdb.d/schema.sql
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    # 健康检查：等待 MySQL 完成首次初始化后才视为就绪（$$ 为 compose 转义，取容器内环境变量）
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -p\"$$MYSQL_ROOT_PASSWORD\""]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s

  # ==========================================
  # Redis 会话缓存与 AI 历史记忆服务
  # ==========================================
  redis:
    image: redis:6.2-alpine
    container_name: community-mall-redis
    restart: always
    ports:
      # 绑定 127.0.0.1：仅供本机开发调试连接，不对局域网/公网暴露
      - "127.0.0.1:6380:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  # ==========================================
  # Java 后端 API 服务
  # ==========================================
  backend:
    build: ./community-mall-backend
    container_name: community-mall-backend
    restart: always
    ports:
      - "8080:8080"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      - MYSQL_HOST=mysql
      - REDIS_HOST=redis
      - LANG=C.UTF-8
      # 数据库账号密码（默认与 MySQL 容器 root 对齐，可通过 .env 覆盖）
      - MYSQL_USERNAME=${MYSQL_USERNAME:-root}
      - MYSQL_PASSWORD=${MYSQL_ROOT_PASSWORD:-root}
      # 透传宿主机的 AI 大模型参数
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - OPENAI_BASE_URL=${OPENAI_BASE_URL:-}
      - OPENAI_MODEL_NAME=${OPENAI_MODEL_NAME:-}
      # 透传宿主机的 MiMo TTS 语音大模型参数
      - MIMO_API_KEY=${MIMO_API_KEY:-}
      - MIMO_BASE_URL=${MIMO_BASE_URL:-}
      - MIMO_MODEL=${MIMO_MODEL:-}
      - MIMO_VOICE=${MIMO_VOICE:-}
    volumes:
      # 将宿主机的 uploads 目录挂载到容器内，实现图片上传和访问持久化
      - ./uploads:/app/uploads

  # ==========================================
  # Vue 前端 Web 服务 (内置 Nginx)
  # ==========================================
  frontend:
    build: ./frontend
    container_name: community-mall-frontend
    restart: always
    ports:
      - "80:80"  # 前端对外暴露端口，可直接通过 http://localhost 访问
    depends_on:
      - backend

volumes:
  mysql_data:
  redis_data:
